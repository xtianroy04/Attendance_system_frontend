<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none" role="img" aria-label="Seventh-day Adventist Church">
  <!-- Gold flame lines (Holy Spirit) -->
  <g stroke="#F5B335" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left flame group -->
    <path stroke-width="7" d="M78 118 C52 96 40 68 48 34"/>
    <path stroke-width="7" d="M88 112 C66 90 56 64 62 32"/>
    <path stroke-width="7" d="M96 108 C80 86 74 62 78 36"/>
    <!-- Right flame group -->
    <path stroke-width="7" d="M118 112 C140 90 150 64 144 32"/>
    <path stroke-width="7" d="M110 108 C126 86 132 62 128 36"/>
    <path stroke-width="7" d="M104 106 C114 86 118 64 116 40"/>
  </g>

  <!-- Black cross -->
  <g fill="#111111">
    <rect x="94" y="72" width="12" height="78" rx="1.5"/>
    <rect x="74" y="92" width="52" height="12" rx="1.5"/>
  </g>

  <!-- Open Bible (teal / dark green) -->
  <g fill="#1A6B5A">
    <!-- Left page -->
    <path d="M22 148 C52 132 78 126 100 126 L100 188 C74 186 48 192 22 208 Z"/>
    <!-- Right page -->
    <path d="M178 148 C148 132 122 126 100 126 L100 188 C126 186 152 192 178 208 Z"/>
  </g>

  <!-- Book edge shading -->
  <path fill="#0F4F43" d="M100 126 L100 188 C96 187.5 92 187.2 88 187.2 L88 128 C92 127 96 126.4 100 126 Z" opacity="0.35"/>
  <path fill="#0F4F43" d="M100 126 L100 188 C104 187.5 108 187.2 112 187.2 L112 128 C108 127 104 126.4 100 126 Z" opacity="0.35"/>

  <!-- Page lines hint -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5">
    <path d="M40 158 H86"/>
    <path d="M42 168 H88"/>
    <path d="M44 178 H86"/>
    <path d="M114 158 H160"/>
    <path d="M112 168 H158"/>
    <path d="M114 178 H156"/>
  </g>
</svg>
